name: Minimal OIDC Test

on:
  workflow_dispatch:
  push:
    branches:
      - edbwe_dev

jobs:
  minimal-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Debug Environment
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Testing OIDC authentication..."
    
      - name: Test Direct OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::203874373410:role/breed-dii-gen-ai-infra-github-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true
      
      - name: Verify Success
        run: |
          aws sts get-caller-identity
          echo "✅ Direct OIDC authentication successful!"