name: Test OIDC Authentication

on:
  workflow_dispatch:
  push:
    branches:
      - edbwe_dev
    paths:
      - '.github/workflows/test-oidc.yml'

jobs:
  test-oidc:
    name: 🧪 Test OIDC Authentication
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐛 Debug Context Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Job: ${{ github.job }}"
          echo "Workflow: ${{ github.workflow }}"
      
      - name: 🔍 Debug OIDC Token Claims
        run: |
          echo "=== OIDC Token Information ==="
          echo "GITHUB_TOKEN available: ${{ github.token != '' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Run Attempt: ${{ github.run_attempt }}"
          echo ""
          echo "Expected OIDC Claims for Trust Policy:"
          echo "  sub: repo:${{ github.repository }}:ref:${{ github.ref }}"
          echo "  aud: sts.amazonaws.com"
          echo "  repository: ${{ github.repository }}"
          echo "  repository_owner: ${{ github.repository_owner }}"
          echo "  ref: ${{ github.ref }}"
          echo ""
          echo "=== Trust Policy should include ==="
          echo 'StringLike: { "token.actions.githubusercontent.com:sub": "repo:${{ github.repository }}:*" }'
          echo "=== End Debug ==="
      
      - name: � Trust Policy Validation
        run: |
          echo "=== Trust Policy Analysis ==="
          echo "✅ Your trust policy INCLUDES: 'repo:sureshchevvu/cubejs:*'"
          echo "✅ OIDC Provider: arn:aws:iam::203874373410:oidc-provider/token.actions.githubusercontent.com"
          echo "✅ Audience: sts.amazonaws.com"
          echo ""
          echo "Since trust policy looks correct, checking other issues:"
          echo "1. ❓ OIDC Provider thumbprint in AWS IAM"
          echo "2. ❓ Token timing/caching issues"
          echo "3. ❓ GitHub OIDC service availability"
          echo "4. ❓ AWS STS service connectivity"
          echo ""
          echo "🔧 Troubleshooting: Adding timing delay and retry..."
      
      - name: 🕐 Pre-Auth Timing Check
        run: |
          echo "Current time: $(date)"
          echo "Waiting 3 seconds for token stabilization..."
          sleep 3
          echo "Ready for authentication attempt"
            - name: 🔍 Validate Repository Secrets
        run: |
          echo "=== Repository Secret Validation ==="
          if [ -z "$DEV_ROLE" ]; then
            echo "❌ CRITICAL: DEV_AWS_ROLE_TO_ASSUME secret is NOT SET or EMPTY"
            exit 1
          else
            echo "✅ DEV_AWS_ROLE_TO_ASSUME: ${DEV_ROLE:0:50}..."
          fi
          if [ -z "$DEV_REGION" ]; then
            echo "❌ CRITICAL: DEV_AWS_REGION secret is NOT SET or EMPTY"
            exit 1
          else
            echo "✅ DEV_AWS_REGION: $DEV_REGION"
          fi
          echo "=== Secrets validation complete ==="
        env:
          DEV_ROLE: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
          DEV_REGION: ${{ secrets.DEV_AWS_REGION }}
            - name: �🔐 Configure AWS credentials (Dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}
        continue-on-error: true
        id: aws-auth
      
      - name: 📋 Trust Policy Analysis (if auth failed)
        if: steps.aws-auth.outcome == 'failure'
        run: |
          echo "🔴 AWS Authentication Failed!"
          echo ""
          echo "=== Trust Policy Status ==="
          echo "✅ VERIFIED: Your trust policy CORRECTLY includes 'repo:sureshchevvu/cubejs:*'"
          echo "✅ VERIFIED: OIDC Provider ARN is correct"
          echo "✅ VERIFIED: Audience condition is correct"
          echo ""
          echo "🔍 Since trust policy is correct, other possible issues:"
          echo ""
          echo "1. 🔧 OIDC Provider Configuration:"
          echo "   - Check if OIDC provider exists in AWS IAM"
          echo "   - Verify thumbprint is up to date"
          echo "   - URL: https://token.actions.githubusercontent.com"
          echo ""
          echo "2. 🕐 Timing/Service Issues:"
          echo "   - GitHub OIDC token generation delays"
          echo "   - AWS STS service temporary issues"
          echo "   - Network connectivity problems"
          echo ""
          echo "3. 🔑 Token Claims Issues:"
          echo "   - GitHub may be sending different claim format"
          echo "   - Token expiration during transmission"
          echo ""
          echo "4. 🌐 AWS Region/Endpoint Issues:"
          echo "   - STS endpoint connectivity"
          echo "   - Region-specific OIDC handling"
          echo ""
          echo "=== Recommended Actions ==="
          echo "1. Verify OIDC provider exists in AWS IAM Console"
          echo "2. Check AWS CloudTrail for AssumeRoleWithWebIdentity attempts"
          echo "3. Try running the workflow again (temporary service issue)"
          echo "4. Check if role has required permissions for STS operations"
      
      - name: 🔍 Verify AWS Authentication
        if: steps.aws-auth.outcome == 'success'
        run: |
          echo "✅ AWS OIDC Authentication successful!"
          echo "Testing AWS CLI access..."
          aws sts get-caller-identity
      
      - name: 🏷️ Test ECR Access
        if: steps.aws-auth.outcome == 'success'
        run: |
          echo "Testing ECR access..."
          aws ecr describe-repositories --region us-east-1 --max-items 5 || echo "ECR access may be limited"
          echo "✅ ECR test completed!"